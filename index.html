<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Yasuichi Shouta" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuukan</title>
    <script src="scripts/main.js" defer></script>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font exo2 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- font icones do side bar-->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="images/icons/tab.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="images/icons/atalho-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta
      property="og:image"
      content="https://shoitixp.github.io/shuukan/images/og-image.jpg"
    />
    <meta property="og:title" content="Shuukan - Be proud of yourself" />
    <meta
      property="og:description"
      content="Assistente para controle e organização Pessoal"
    />
  </head>
  <body>
    <header class="page-layout-header">
      <a href="index.html" class="home">
        <img src="images/logo-shuukan.png" alt="" class="logo-shuukan" />
        <span id="nome-site">Shuukan</span>
        <span id="slogan" lang="en">Be proud of yourself</span>
      </a>
      <input
        type="text"
        id="quick"
        name="quick"
        placeholder="Quick command..."
      />
      <div class="painel-data">
        <time id="data-hoje" datetime="2026-01-31"></time>
        <span id="dia-semana-hoje"></span>
        <time id="hora-hoje" datetime="00:00"></time>
      </div>
      <div class="painel-tarefa">
        <p>
          Sua próxima tarefa é:
          <span id="proxima-tarefa"><strong>colocar função aqui</strong></span>
        </p>
        <input
          type="text"
          id="local-tarefa"
          name="tarefa"
          placeholder="Local da tarefa"
        />
        <input
          type="text"
          id="condicional-tarefa"
          name="condicional"
          placeholder="Condicional"
        />
      </div>
    </header>
    <nav class="sidebar">
      <ul>
        <li>
          <a href="#"
            ><span class="material-symbols-rounded">calendar_clock</span>Agenda
            Geral
          </a>
        </li>
        <li>
          <a href="#"
            ><span class="material-symbols-rounded">payments</span>Financeiro
          </a>
          <ul>
            <li><a href="#">Despesas</a></li>
            <li><a href="#">Receitas</a></li>
            <li><a href="#">DRE</a></li>
            <li><a href="#">Investimentos</a></li>
            <li><a href="#">Compras</a></li>
          </ul>
        </li>
        <li>
          <a href="#"
            ><span class="material-symbols-rounded">lightning_stand</span>Skills
          </a>
        </li>
        <li>
          <a href="#"
            ><span class="material-symbols-rounded">swords</span>RPG
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <h1>Agenda</h1>
      <!-- Adicionar Mẽs atual aqui-->
    </main>
  </body>
</html>
